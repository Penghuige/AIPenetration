# 面板 v2 主管线配置（指南 §19.2；口径变更须同步 docs/panel_v2_设计.md）
# 定位声明（2026-09-09 审计）：本文件是**口径登记文档**（唯一权威参数清单），
# 运行时代码**不直接读取**全部字段（各模块仍有常量/CLI 参数）；其内容
# 经发布 metadata 的 config_hash 背书。新增参数或改语义时须同步三处：
# 本文件、对应模块常量、设计文档。运行期真正生效的绑定在代码（如
# dedup.ADMISSION_WHERE、scoring.THRESHOLDS）。
panel_version: v2i
dictionary_version: bilingual_a_frozen_v1.1+governed_v1.4


identity:
  job_id_formula: sha256_63bit(source_platform + unit_separator + job_id_raw)
  full_formula: SHA256(source_platform | job_id_raw)
  collision_policy: block_release
  note: "63-bit surrogate only for compute efficiency; full SHA256 construction is fixed"

scope:
  cities: [广州市, 深圳市]      # v2a 先广深；全国由用户排窗后扩
  years: [2014, 2025]          # eps 实际可得止于 2024，运行期自动 clamp 并记录

lexicon:
  atier: true                  # A 级冻结概念（ai_dict，110,970 激活别名 → 22,683 概念）
  legacy_terms: true           # 自建技术词并入（pytorch/tensorflow/halcon 等 A 级盲区）
  legacy_namespace: "legacy:"  # 合成 skill_id 前缀，不污染 uuid 空间

dedup:                         # 指南 §6.2 岗位去重主规则
  unique_key: [platform, recruit_id]
  group_by: [company, position_normalized, city, desc_hash]
  group_max_gap_days: 30
  # 审计更正：分组键=(company,岗位名,城市,文本hash,年,桶) **不含平台**，同企业
  # 同文本跨平台帖进同一概念组（规则1 仅按 (platform,rid) 折叠原始行）；
  # §6.2.0 的"分离"指词典频数语料与主样本分离，不适用于概念分组。
  cross_platform_merge: true

cooccurrence:                  # §13–§14
  anchors: [main, cn_paper, babina]
  windows: [annual, pooled, roll3_centered]
  boundary_windows: {start: [2014, 2015], end: [2023, 2024]}  # 2026-09 审计更正：eps 无 2025，实际末两年窗 {2023,2024}（代码按可得年 clamp）
  keep_all_skills: true        # §13.4 低频不删除，只打 rare 标记
  rare_flags: [10, 20, 50]
  smoothing:
    per_unit: [anchor_version, window_type]   # §14.2 逐单元拟合
    min_fit_n: 5
    fallback: jeffreys

job_score:                     # §15–§16
  aggregation: simple_mean_dedup_skills
  score_types: [raw, smoothed]
  # 主指标语义沿革与终版（2026-09-10 按指南原预案复原，用户指示纠偏）：
  #   指南 §2.4/§16.4 白纸黑字："主AI岗位标识：得分严格大于0.05"；
  #   "主阈值为0.05；0.10和0.15用于与Babina方法及阈值敏感性比较"。
  #   测量对象按指南=「AI 相关岗位」（相关度），此前 09-09 切 015、讨论切 030
  #   均属把"净核心职责 AI 岗占比"（我方金标准的追加问题）错置到主口径上。
  #   金标准结论（015 带核心职责真值 ~30-56%、>0.30 带 87.5-96.7%）降格为
  #   **补充解释层**，不再反向定义主指标。
  primary_score: aijob_main_annual_raw_005   # AI 相关岗位标识（指南原义）
  sensitivity_scores: [aijob_main_annual_raw_010, aijob_main_annual_raw_015]  # Babina 对标
  supplementary_highconf: aijob_main_annual_raw_015  # 金标准口径下的高纯子集另述
  thresholds: [0.05, 0.10, 0.15]
  strict_greater: true
  zero_skill_rule: {keep_row: true, score: missing, flags: 0, override: zero_skill_override}
  require_coverage_one: true   # §15.3 score_skill_coverage<1 阻断

robustness:                    # §14.3 企业留一（主锚点、三窗口、原始率）
  leave_one_firm: {enabled: true, anchors: [main], score_type: raw}

release:                       # §17.6/§18
  quality_gate_fail_blocks: true
  outputs_dir: output/release/panel_v2i
  metadata_fields: 11   # 指南 §18.1 原单 11 项（"至少包含"）；旧述"12"系笔误（2026-09-09 审计修正）
