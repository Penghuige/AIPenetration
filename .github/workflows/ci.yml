name: offline-contract-tests

on:
  pull_request:
  push:
    branches:
      - master
      - "fix/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile
        run: python -m compileall -q src config
      - name: Static fatal checks
        run: python -m flake8 src config --select=E9,F63,F7,F82 --max-line-length=110
      - name: Offline tests
        run: pytest src/tests/ -q
