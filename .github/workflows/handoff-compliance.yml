name: handoff-compliance

on:
  pull_request:
  push:
    branches: [master]

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile
        run: python -m compileall -q src config
      - name: Lint fatal errors
        run: python -m flake8 src config --select=F,E9 --max-line-length=110
      - name: Offline tests
        run: pytest src/tests/ -q
